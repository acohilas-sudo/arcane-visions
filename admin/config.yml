backend:
  name: github
  repo: acohilas-sudo/arcane-visions
  branch: main
media_folder: "images/uploads"
public_folder: "/images/uploads"
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"
collections:
  - name: "catalogue"
    label: "The Work"
    label_singular: "Work"
    folder: "content/catalogue"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{name}} — {{tradition}} / {{category}}"
    sortable_fields: ["name", "tradition", "category"]
    fields:
      - label: "Name"
        name: "name"
        widget: "string"
      - label: "Tradition / Context"
        name: "tradition"
        widget: "select"
        options:
          - "Hermetic Order of the Golden Dawn"
          - "Rosicrucian"
          - "Martinist"
          - "Masonic"
          - "Rectified Scottish Rite"
          - "Christian Hermetic"
          - "Christian"
          - "Hermetic"
          - "Alchemical"
          - "Heraldic"
          - "Private Collector"
          - "Independent / Custom"
        default: "Hermetic Order of the Golden Dawn"
      - label: "Category"
        name: "category"
        widget: "select"
        default: "Symbolic Art"
        options:
          - "Symbolic Art"
          - "Portraiture"
          - "Wearable Works"
          - "Other"
        hint: "Site taxonomy is intentionally narrow. Choose 'Symbolic Art' for ceremonial, devotional, bas-relief, heraldic, lamen, and hand-painted symbolic work; 'Portraiture' for portrait commissions; 'Wearable Works' for wearable artistic objects — battle jackets, bespoke shoes, esoteric fashion and wearable surrealism (artworks made to be worn, NOT ceremonial regalia or ritual equipment); 'Other' only as an escape hatch — a new category warrants editorial review before being added to the filter bar."
      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        hint: "Toggle ON to display this work on the home page."
      - label: "Photos"
        name: "photos"
        widget: "list"
        label_singular: "Photo"
        summary: "{{fields.alt}}"
        required: false
        fields:
          - label: "Image"
            name: "image"
            widget: "image"
            choose_url: false
          - label: "Alt Text"
            name: "alt"
            widget: "string"
            hint: "Brief description for accessibility and SEO."
      - label: "Price"
        name: "price"
        widget: "string"
        required: false
        hint: "Leave blank for Price on Inquiry."
      - label: "Stripe Payment Link"
        name: "stripe_link"
        widget: "string"
        required: false
        pattern: ['^(https://buy\.stripe\.com/.+)?$', "Must be a Stripe Payment Link (https://buy.stripe.com/...) or blank."]
        hint: "Paste a Stripe-hosted Payment Link (https://buy.stripe.com/...) to make this piece directly purchasable — the page shows a Purchase button instead of the inquiry CTA. Leave blank to keep it inquiry-only."
      - label: "Acquisition Mode"
        name: "purchase_mode"
        widget: "select"
        default: "inquiry"
        options:
          - { label: "Inquiry — available, acquired by inquiry", value: "inquiry" }
          - { label: "Direct — completed work for direct acquisition", value: "direct" }
          - { label: "Commission — bespoke, built to order", value: "commission" }
          - { label: "Archival — acquired one-of-one, portfolio only (no purchase or inquiry button)", value: "archival" }
        hint: "How this piece is acquired (the acquisition mechanism). For most works, leave 'Section / Placement' below on Auto — it follows this field. A Stripe Payment Link (above) turns Inquiry/Direct/Commission pieces into a Purchase button; it never overrides Archival."
      - label: "Section / Placement"
        name: "availability"
        widget: "select"
        required: false
        default: ""
        options:
          - { label: "Auto — place from Acquisition Mode", value: "" }
          - { label: "The Work — available / obtainable now", value: "available" }
          - { label: "Commissions — example available by commission", value: "commission" }
          - { label: "Private Collections — placed, unavailable", value: "private_collection" }
          - { label: "Private Collections — placed; similar works by commission", value: "private_collection_commissionable" }
        hint: "Where this work appears on the site. Leave on 'Auto' to place it from Acquisition Mode (direct/inquiry → The Work, commission → Commissions, archival → Private Collections). Set explicitly only to override — e.g. an acquired work whose similar pieces remain commissionable."
      - label: "Acquisition Status"
        name: "acquisition_status"
        widget: "string"
        required: false
        hint: "Optional short status line shown with the price, e.g. 'Edition of 4', 'Available by Inquiry', or 'Acquired · One-of-One Work'. Leave blank for none."
      - label: "Acquisition Note"
        name: "acquisition_note"
        widget: "string"
        required: false
        hint: "Optional secondary line under the status — availability or reinterpretation wording, e.g. 'Currently in transit and available for fulfillment upon return.' Leave blank for none."
      - label: "Specifications"
        name: "specs"
        widget: "text"
        required: false
        hint: "Dimensions, materials, techniques — one per line."
      - label: "Description"
        name: "body"
        widget: "markdown"
  - name: "home"
    label: "Home Page"
    files:
      - name: "home"
        label: "Home Page Content"
        file: "content/home.md"
        fields:
          - label: "Tagline"
            name: "tagline"
            widget: "string"
          - label: "Subtitle"
            name: "subtitle"
            widget: "text"
          - label: "Tradition Tags"
            name: "tradition_tags"
            widget: "list"
            field:
              label: "Tag"
              name: "tag"
              widget: "string"
  - name: "about"
    label: "About Page"
    files:
      - name: "about"
        label: "About Page Content"
        file: "content/about.md"
        fields:
          - label: "Body"
            name: "body"
            widget: "markdown"
  - name: "commissions"
    label: "Commissions Page"
    files:
      - name: "commissions"
        label: "Commissions Content"
        file: "content/commissions.md"
        fields:
          - label: "Heading"
            name: "heading"
            widget: "string"
          - label: "Body"
            name: "body"
            widget: "markdown"
          - label: "Requirements"
            name: "requirements"
            widget: "list"
            field:
              label: "Item"
              name: "item"
              widget: "string"
  - name: "private-collections"
    label: "Private Collections Page"
    files:
      - name: "private-collections"
        label: "Private Collections Content"
        file: "content/private-collections.md"
        fields:
          - label: "Heading"
            name: "heading"
            widget: "string"
          - label: "Body"
            name: "body"
            widget: "markdown"
            hint: "Intro shown at the top of the Works in Private Collections page."
